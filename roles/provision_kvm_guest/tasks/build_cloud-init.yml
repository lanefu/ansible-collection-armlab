---
- name: render meta-data
  template:
    src: meta-data.j2
    dest: "{{ provision_kvm_guest_machine_folder }}/meta-data"
  tags:
    - cloud-init
    - meta-data

- name: render user-data
  template:
    src: user-data.j2
    dest: "{{ provision_kvm_guest_machine_folder }}/user-data"
  tags:
    - cloud-init
    - user-data

- name: render custom network-config
  copy:
    content: "{{ provision_kvm_guest_cloud_init_network_config }}"
    dest: "{{ provision_kvm_guest_machine_folder }}/network-config"
  tags:
    - cloud-init
    - network-config
  when:
    - provision_kvm_guest_cloud_init_network_config is defined
    - provision_kvm_guest_cloud_init_network_config | length > 0

- name: render network-config
  template:
    src: network-config.j2
    dest: "{{ provision_kvm_guest_machine_folder }}/network-config"
  tags:
    - cloud-init
    - network-config
  when:
    - provision_kvm_guest_ip4_address_summarized | default("") | length > 0
    - provision_kvm_guest_cloud_init_network_config | default('') | length == 0
